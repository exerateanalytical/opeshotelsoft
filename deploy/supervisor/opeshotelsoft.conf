; /etc/supervisor/conf.d/opeshotelsoft.conf  (alternative to the systemd units; use one, not both)
; supervisorctl reread && supervisorctl update && supervisorctl status

[program:opeshotelsoft-queue]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /var/www/opeshotelsoft/current/artisan queue:work --sleep=3 --tries=3 --max-time=3600 --memory=256
directory=/var/www/opeshotelsoft/current
user=www-data
numprocs=2
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=90
redirect_stderr=true
stdout_logfile=/var/log/opeshotelsoft/queue.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5

[program:opeshotelsoft-scheduler]
command=/usr/bin/php /var/www/opeshotelsoft/current/artisan schedule:work
directory=/var/www/opeshotelsoft/current
user=www-data
numprocs=1
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/opeshotelsoft/scheduler.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
