# /etc/nginx/sites-available/opeshotelsoft  (bare-metal install; php8.3-fpm on a unix socket)
# Certificates via certbot: certbot --nginx -d hotel.example.com
server {
    listen 80;
    listen [::]:80;
    server_name hotel.example.com;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name hotel.example.com;
    root /var/www/opeshotelsoft/current/public;
    index index.php;

    ssl_certificate     /etc/letsencrypt/live/hotel.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hotel.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 25m;
    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;

    # HTML first loads carry the translations (login page ~315 kB raw, ~85 kB gzipped); see docs/PERFORMANCE.md.
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/css text/plain application/javascript application/json application/manifest+json image/svg+xml font/ttf application/vnd.ms-fontobject;

    # Brand images and icons are not fingerprinted: cache a week.
    location ~* ^/(brand/|icon-|favicon) { expires 7d; add_header Cache-Control "public"; try_files $uri =404; }

    location /build/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
    location / { try_files $uri $uri/ /index.php?$query_string; }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 120s;
    }

    location ~ /\.(?!well-known) { deny all; }
}
