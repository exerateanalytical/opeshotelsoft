# nginx in front of php-fpm (container "app:9000"). TLS is terminated by the host
# reverse proxy / load balancer (see docs/DEPLOY.md), which must send X-Forwarded-Proto.
upstream php_fpm {
    server app:9000;
}

server {
    listen 80 default_server;
    server_name _;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 25m;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # HTML first loads carry the translations (login page ~315 kB raw, ~85 kB gzipped); see docs/PERFORMANCE.md.
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/css text/plain application/javascript application/json application/manifest+json image/svg+xml font/ttf application/vnd.ms-fontobject;

    # Brand images and icons are not fingerprinted: cache a week.
    location ~* ^/(brand/|icon-|favicon) {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location = /nginx-health { access_log off; return 200 "ok\n"; }

    # Fingerprinted Vite assets: cache forever.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass php_fpm;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_read_timeout 120s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location ~ /\.(?!well-known) { deny all; }
}
