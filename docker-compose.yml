# OpesHotelSoft production stack.
#   cp .env.production.example .env   # fill in secrets
#   docker compose build && docker compose up -d
# Publishes nginx on 127.0.0.1:8080; put a TLS reverse proxy (Caddy/nginx/Traefik) in front.

x-app: &app
  image: opeshotelsoft/app:${APP_IMAGE_TAG:-latest}
  build:
    context: .
    target: app
  env_file: .env
  environment:
    DB_HOST: postgres
    DB_PORT: "5432"
    REDIS_HOST: redis
    LOG_CHANNEL: stderr_json
    BACKUP_PATH: /var/www/html/storage/app/backups
  volumes:
    - storage:/var/www/html/storage
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  app:
    <<: *app
    environment:
      ROLE: app
      RUN_MIGRATIONS: "${RUN_MIGRATIONS:-true}"
      DB_HOST: postgres
      DB_PORT: "5432"
      REDIS_HOST: redis
      LOG_CHANNEL: stderr_json
      BACKUP_PATH: /var/www/html/storage/app/backups

  worker:
    <<: *app
    environment:
      ROLE: worker
      DB_HOST: postgres
      DB_PORT: "5432"
      REDIS_HOST: redis
      LOG_CHANNEL: stderr_json
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'queue:work' >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  scheduler:
    <<: *app
    environment:
      ROLE: scheduler
      DB_HOST: postgres
      DB_PORT: "5432"
      REDIS_HOST: redis
      LOG_CHANNEL: stderr_json
      BACKUP_PATH: /var/www/html/storage/app/backups
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'schedule:work' >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  nginx:
    image: opeshotelsoft/web:${APP_IMAGE_TAG:-latest}
    build:
      context: .
      target: web
    ports:
      - "${HTTP_BIND:-127.0.0.1:8080}:80"
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health | grep -q '\"status\"' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-opeshotelsoft}
      POSTGRES_USER: ${DB_USERNAME:-opes}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  storage:
  pgdata:
  redisdata:
